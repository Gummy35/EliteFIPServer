<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Exobiology Scans</title>
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.5/css/jquery.dataTables.min.css">
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #000;
            color: #fff;
        }

        .container {
            max-width: 1200px;
            margin: 20px auto;
            padding: 20px;
            background-color: #1b1b1b;
            border-radius: 10px;
        }

        label, input {
            font-size: 0.9em;
            margin-right: 10px;
        }

            input[type="number"] {
                width: 80px;
            }

        #filters {
            margin-bottom: 15px;
        }

        #scans-table {
            width: 100% !important;
        }

        .crt-colorsep {
            animation: textShadow 1.6s infinite;
        }

        @keyframes textShadow {
            0% {
                text-shadow: 0.5px 0 1px rgba(0,30,255,0.5), -0.5px 0 1px rgba(255,0,80,0.3), 0 0 3px;
            }

            25% {
                text-shadow: 2px 0 1px rgba(0,30,255,0.5), -2px 0 1px rgba(255,0,80,0.3), 0 0 3px;
            }

            50% {
                text-shadow: 0.1px 0 1px rgba(0,30,255,0.5), -0.1px 0 1px rgba(255,0,80,0.3), 0 0 3px;
            }

            75% {
                text-shadow: 1.5px 0 1px rgba(0,30,255,0.5), -1.5px 0 1px rgba(255,0,80,0.3), 0 0 3px;
            }

            100% {
                text-shadow: 2px 0 1px rgba(0,30,255,0.5), -2px 0 1px rgba(255,0,80,0.3), 0 0 3px;
            }
        }

        .scanlines {
            position: relative;
            overflow: hidden;
        }

            .scanlines:after {
                content: "";
                position: absolute;
                top: 0;
                left: 0;
                right: 0;
                bottom: 0;
                background: repeating-linear-gradient( to bottom, rgba(0,0,0,0) 0px, rgba(0,0,0,0.2) 1px, rgba(0,0,0,0) 2px );
                pointer-events: none;
                z-index: 5;
                animation: scanlines 1s steps(60) infinite;
            }

        @keyframes scanlines {
            0% {
                background-position: 0 0;
            }

            100% {
                background-position: 0 4px;
            }
        }

        #scans-table tbody td {
            animation: textShadow 1.6s infinite;
        }
    </style>
</head>
<body>
    <div class="container scanlines">
        <h1 class="crt-colorsep">Exobiology Scans</h1>
        <div id="filters">
            <label for="maxDistance">Max Distance:</label>
            <input type="number" id="maxDistance" value="1000">
            <label for="minValue">Min Value:</label>
            <input type="number" id="minValue" value="0">
            <button id="applyFilters">Apply Filters</button>
        </div>
        <table id="scans-table" class="display"></table>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.5/js/jquery.dataTables.min.js"></script>
    <script src="exo.js"></script>
</body>
</html>
